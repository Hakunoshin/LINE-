name = "personal-line-agent"
main = "src/index.ts"
compatibility_date = "2024-11-01"
# Anthropic SDKがnode:path等のNode組み込みを参照するため必要。
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "personal-line-agent-db"
database_id = "33f5b60d-0abd-40ed-8fbb-4f93041aecb1"

# 1分ごとに期限切れリマインダーのチェックと毎日ダイジェスト送信時刻の判定を行う
[triggers]
crons = ["* * * * *"]

[vars]
# 毎日ダイジェストを送るJSTの時刻。"HH:MM"形式のカンマ区切りで複数指定可。
DAILY_DIGEST_TIME_JST = "07:30,13:00,18:00"

# circus求人 → Threads自動投稿の実行時刻(JST, カンマ区切り)と1回あたりの投稿件数。
# CIRCUS_JOBS_URL / CIRCUS_LOGIN_URL / CIRCUS_EMAIL / CIRCUS_PASSWORD /
# THREADS_APP_ID / THREADS_APP_SECRET はsecretで設定する。
THREADS_AUTOPOST_TIME_JST = "09:00,15:00,21:00"
THREADS_MAX_POSTS_PER_RUN = "1"
# 投稿指標の収集+分析(伸びる型の学習)を回すJSTの時刻。1日1回。
THREADS_INSIGHTS_TIME_JST = "23:30"
