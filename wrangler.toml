name = "personal-line-agent"
main = "src/index.ts"
compatibility_date = "2024-11-01"

[[d1_databases]]
binding = "DB"
database_name = "personal-line-agent-db"
database_id = "33f5b60d-0abd-40ed-8fbb-4f93041aecb1"

# 1分ごとに期限切れリマインダーのチェックと毎日ダイジェスト送信時刻の判定を行う
[triggers]
crons = ["* * * * *"]

[vars]
# 毎日ダイジェストを送るJSTの時刻。"HH:MM"形式のカンマ区切りで複数指定可。
DAILY_DIGEST_TIME_JST = "07:30,13:00,18:00"
# 朝の配信に付ける天気の地点(既定: 東京)。緯度・経度・表示名。
WEATHER_LATITUDE = "35.6895"
WEATHER_LONGITUDE = "139.6917"
WEATHER_LOCATION_NAME = "東京"

# --- note記事の下書き自動生成(任意) ---
# AIが記事を生成してLINEに届ける(公開はnoteに貼り付けて手動で行う)。要 ANTHROPIC_API_KEY。
# 定期生成する時刻(JST)。設定すると有効化。手動コマンド(note下書き)は時刻設定なしでも使える。
# NOTE_POST_TIME_JST = "09:00"
# 生成する曜日(JST, 0=日〜6=土)のカンマ区切り。未設定なら毎日。例: 平日のみ = "1,2,3,4,5"
# NOTE_POST_DOW = "1,3,5"
# お題を拾うYouTubeチャンネルID。未設定ならASH RADIO。空文字("")で無効化しトピックを使う。
# NOTE_YOUTUBE_CHANNEL_ID = "UCX-nFhpazzoU5NZfgPGXI2Q"
# チャンネル無効時に使う記事テーマ候補。改行または「|」区切り。未設定ならキャリア系デフォルト。
# NOTE_TOPICS = "転職の面接対策|職務経歴書の書き方|キャリアの棚卸し"
